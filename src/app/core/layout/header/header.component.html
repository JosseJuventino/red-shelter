<header class="header">
  <div class="header__bar">
    <a class="header__brand" routerLink="/" aria-label="Huellas, ir al inicio">
      huellas<span class="header__brand-dot">.</span>
    </a>

    <nav class="header__nav" aria-label="Principal">
      @for (item of navItems; track item.path) {
        <a
          class="header__link"
          [routerLink]="item.path"
          routerLinkActive="header__link--active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          ariaCurrentWhenActive="page"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <a class="header__favorites" routerLink="/favoritos">
      <svg class="header__favorites-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 20.5s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 2.8c0 5.5-7.5 10.1-7.5 10.1Z"
        />
      </svg>
      <span>Favoritos</span>
      <span class="header__badge" [attr.aria-label]="favoritesCount() + ' favoritos'">
        {{ favoritesCount() }}
      </span>
    </a>
  </div>
</header>
